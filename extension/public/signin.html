<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Ascend</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5fa;
        color: #0f172a;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 6px;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 18px;
        padding: 9px 18px;
        border: 0;
        border-radius: 8px;
        background: #06b6d4;
        color: #0f172a;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon128.png" alt="" />
      <h1 id="status">Opening Google…</h1>
      <p id="detail"></p>
      <button id="retry" class="hidden" type="button">Try again</button>
    </main>
    <script src="signin.js"></script>
  </body>
</html>
